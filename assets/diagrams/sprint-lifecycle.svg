<svg xmlns="http://www.w3.org/2000/svg" width="960" height="310" font-family="Segoe UI, Arial, sans-serif">

  <!-- Background -->
  <rect width="960" height="310" fill="#f9fafb" rx="10"/>

  <!-- Title -->
  <text x="480" y="34" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Sprint Lifecycle — BankVault</text>
  <line x1="80" y1="44" x2="880" y2="44" stroke="#e5e7eb" stroke-width="1"/>

  <!-- ── SPRINT 0 ── -->
  <rect x="30" y="60" width="185" height="220" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="30" y="60" width="185" height="38" rx="8" fill="#3b82f6"/>
  <rect x="30" y="88" width="185" height="10" fill="#3b82f6"/>
  <text x="122" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="white">SPRINT 0</text>
  <text x="122" y="114" text-anchor="middle" font-size="11" fill="#1e40af" font-weight="bold">Planning</text>
  <line x1="50" y1="122" x2="195" y2="122" stroke="#bfdbfe" stroke-width="1"/>
  <text x="50" y="140" font-size="10.5" fill="#374151">▸ Product vision defined</text>
  <text x="50" y="158" font-size="10.5" fill="#374151">▸ 9 user stories written</text>
  <text x="50" y="176" font-size="10.5" fill="#374151">▸ Acceptance criteria set</text>
  <text x="50" y="194" font-size="10.5" fill="#374151">▸ Story points estimated</text>
  <text x="50" y="212" font-size="10.5" fill="#374151">▸ Definition of Done agreed</text>
  <text x="50" y="230" font-size="10.5" fill="#374151">▸ Sprint 1 &amp; 2 scoped</text>

  <!-- Arrow 0→1 -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6b7280"/>
    </marker>
  </defs>
  <line x1="217" y1="170" x2="245" y2="170" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── SPRINT 1 ── -->
  <rect x="248" y="60" width="185" height="220" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="248" y="60" width="185" height="38" rx="8" fill="#16a34a"/>
  <rect x="248" y="88" width="185" height="10" fill="#16a34a"/>
  <text x="340" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="white">SPRINT 1</text>
  <text x="340" y="114" text-anchor="middle" font-size="11" fill="#166534" font-weight="bold">Mar 11 – 19 · Execution</text>
  <line x1="268" y1="122" x2="413" y2="122" stroke="#bbf7d0" stroke-width="1"/>
  <text x="268" y="140" font-size="10.5" fill="#374151">▸ Domain model (Customer,</text>
  <text x="268" y="155" font-size="10.5" fill="#374151">    Account, Transaction)</text>
  <text x="268" y="173" font-size="10.5" fill="#374151">▸ Deposit &amp; withdrawal ops</text>
  <text x="268" y="191" font-size="10.5" fill="#374151">▸ 7-exception error framework</text>
  <text x="268" y="209" font-size="10.5" fill="#374151">▸ Input validation layer</text>
  <text x="268" y="227" font-size="10.5" fill="#374151">▸ 17 unit tests — PR #1 merged</text>

  <!-- Arrow 1→2 -->
  <line x1="435" y1="170" x2="463" y2="170" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── SPRINT 2 ── -->
  <rect x="466" y="60" width="185" height="220" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <rect x="466" y="60" width="185" height="38" rx="8" fill="#ea580c"/>
  <rect x="466" y="88" width="185" height="10" fill="#ea580c"/>
  <text x="558" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="white">SPRINT 2</text>
  <text x="558" y="114" text-anchor="middle" font-size="11" fill="#9a3412" font-weight="bold">Mar 25 – Apr 2 · Improvement</text>
  <line x1="486" y1="122" x2="631" y2="122" stroke="#fed7aa" stroke-width="1"/>
  <text x="486" y="140" font-size="10.5" fill="#374151">▸ File persistence (NIO)</text>
  <text x="486" y="158" font-size="10.5" fill="#374151">▸ Regex validation &amp; email</text>
  <text x="486" y="176" font-size="10.5" fill="#374151">▸ Thread-safe concurrency</text>
  <text x="486" y="194" font-size="10.5" fill="#374151">▸ Transfers &amp; statements</text>
  <text x="486" y="212" font-size="10.5" fill="#374151">▸ 32 tests · CI pipeline live</text>
  <text x="486" y="230" font-size="10.5" fill="#374151">▸ Structured logging added</text>

  <!-- Arrow 2→Done -->
  <line x1="653" y1="170" x2="681" y2="170" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── DONE ── -->
  <rect x="684" y="60" width="185" height="220" rx="8" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
  <rect x="684" y="60" width="185" height="38" rx="8" fill="#7c3aed"/>
  <rect x="684" y="88" width="185" height="10" fill="#7c3aed"/>
  <text x="776" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="white">SHIPPED ✓</text>
  <text x="776" y="114" text-anchor="middle" font-size="11" fill="#6b21a8" font-weight="bold">All Criteria Met</text>
  <line x1="704" y1="122" x2="849" y2="122" stroke="#e9d5ff" stroke-width="1"/>
  <text x="704" y="140" font-size="10.5" fill="#374151">▸ CI green on every push</text>
  <text x="704" y="158" font-size="10.5" fill="#374151">▸ 32 tests passing</text>
  <text x="704" y="176" font-size="10.5" fill="#374151">▸ Full Javadoc coverage</text>
  <text x="704" y="194" font-size="10.5" fill="#374151">▸ Data persisted to disk</text>
  <text x="704" y="212" font-size="10.5" fill="#374151">▸ Operations logged</text>
  <text x="704" y="230" font-size="10.5" fill="#374151">▸ DoD satisfied</text>

  <!-- Footer -->
  <text x="480" y="298" text-anchor="middle" font-size="10" fill="#9ca3af">Agile Foundations · Amalitech Apprenticeship · BankVault</text>

</svg>
